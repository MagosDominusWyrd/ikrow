name: Update Rysya post

on:
  schedule:
    - cron: "17 * * * *"

  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Rysya updater
        run: python3 scripts/update_rysya_post.py

      - name: Commit updated post
        id: commit
        run: |
          if git diff --quiet -- data/rysya-latest.json; then
            echo "Последний пост Рыси не изменился."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/rysya-latest.json
          git commit -m "Update latest Rysya post"
          git push

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Hugo deployment
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run hugo.yml --ref main
