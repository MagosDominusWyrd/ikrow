name: Update Rysya post

on:
  schedule:
    - cron: "17 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Rysya updater
        run: python3 scripts/update_rysya_post.py

      - name: Commit updated post
        run: |
          if git diff --quiet -- data/rysya-latest.json; then
            echo "Последний пост Рыси не изменился."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/rysya-latest.json
          git commit -m "Update latest Rysya post"
          git push
